apiVersion: apps/v1
kind: Deployment
metadata:
  name: ops-dashboard
  namespace: prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ops-dashboard
  template:
    metadata:
      labels:
        app: ops-dashboard
    spec:
      imagePullSecrets:
        - name: ecr-secret
      containers:
      - name: ops-dashboard
        image: 889276611436.dkr.ecr.eu-west-1.amazonaws.com/ops-dashboard:latest
        ports:
        - containerPort: 8080
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
        envFrom:
        - configMapRef:
            name: sentinel-config