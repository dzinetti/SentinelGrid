apiVersion: v1
kind: Service
metadata:
  name: ops-dashboard
  namespace: sentinelgrid
  labels:
    app: ops-dashboard
spec:
  type: LoadBalancer
  selector:
    app: ops-dashboard
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ops-dashboard
  namespace: sentinelgrid
  labels:
    app: ops-dashboard
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ops-dashboard
  template:
    metadata:
      labels:
        app: ops-dashboard
    spec:
      containers:
        - name: ops-dashboard
          # Placeholder da sostituire con l'IMAGE_URI generato dalla pipeline
          image: 889276611436.dkr.ecr.eu-west-1.amazonaws.com/ops-dashboard
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: COMMAND_API_URL
              valueFrom:
                configMapKeyRef:
                  name: sentinelgrid-config
                  key: COMMAND_API_URL
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5