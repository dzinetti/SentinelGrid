version: 0.2

phases:
  pre_build:
    commands:
      - echo "Autenticazione su Amazon ECR..."
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
      - REPO_PREFIX=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
      - COMMIT_HASH=$(echo $CODEBUILD_RESOLVED_COMMIT_HASH | cut -c 1-7)
      - IMAGE_TAG=${COMMIT_HASH:-latest}
      # Salva le variabili su file di ambiente locale per riutilizzarle nelle fasi successive
      - echo "export REPO_PREFIX=$REPO_PREFIX" >> /tmp/env_vars
      - echo "export IMAGE_TAG=$IMAGE_TAG" >> /tmp/env_vars

  build:
    commands:
      - source /tmp/env_vars
      - echo "Building delle immagini Docker..."
      - docker build -t $REPO_PREFIX/beacon-api:$IMAGE_TAG ./app-source/beacon-api
      - docker build -t $REPO_PREFIX/command-api:$IMAGE_TAG ./app-source/command-api
      - docker build -t $REPO_PREFIX/ops-dashboard:$IMAGE_TAG ./app-source/ops-dashboard
      - docker build -t $REPO_PREFIX/triage-worker:$IMAGE_TAG ./app-source/triage-worker

  post_build:
    commands:
      - source /tmp/env_vars
      - echo "Push delle immagini su ECR..."
      - docker push $REPO_PREFIX/beacon-api:$IMAGE_TAG
      - docker push $REPO_PREFIX/command-api:$IMAGE_TAG
      - docker push $REPO_PREFIX/ops-dashboard:$IMAGE_TAG
      - docker push $REPO_PREFIX/triage-worker:$IMAGE_TAG
      
      - echo "Sostituzione segnaposto nei manifest K8s..."
      - sed -i "s|IMAGE_PLACEHOLDER_BEACON|$REPO_PREFIX/beacon-api:$IMAGE_TAG|g" k8s/beacon-api/deployment.yaml
      - sed -i "s|IMAGE_PLACEHOLDER_COMMAND|$REPO_PREFIX/command-api:$IMAGE_TAG|g" k8s/command-api/deployment.yaml
      - sed -i "s|IMAGE_PLACEHOLDER_OPS|$REPO_PREFIX/ops-dashboard:$IMAGE_TAG|g" k8s/ops-dashboard/deployment.yaml
      - sed -i "s|IMAGE_PLACEHOLDER_TRIAGE|$REPO_PREFIX/triage-worker:$IMAGE_TAG|g" k8s/triage-worker/cronjob.yaml
      
      # Stampa a video il manifest per verificare nei log che l'immagine sia corretta
      - echo "Verifica del manifest generato per beacon-api:"
      - cat k8s/beacon-api/deployment.yaml | grep image:

artifacts:
  files:
    - 'k8s/**/*'